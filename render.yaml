# Render Blueprint for the Nexora API (native Python, no Docker; see docs/decisions/0002).
# Secrets use sync: false, so Render asks for them when the Blueprint is created.
services:
  - type: web
    name: nexora-api
    runtime: python
    plan: free
    branch: main          # production deploys only from main
    autoDeploy: true
    region: frankfurt
    rootDir: backend
    # Free plan has no pre-deploy step, so migrations run at the end of the build.
    # A failed migration fails the deploy and the previous version keeps serving.
    buildCommand: pip install . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL          # Neon pooled URL (host contains -pooler)
        sync: false
      - key: MIGRATION_DATABASE_URL  # Neon direct URL, used by Alembic
        sync: false
      - key: CORS_ORIGINS          # e.g. https://nexora.pages.dev
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
